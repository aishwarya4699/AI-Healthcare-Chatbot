<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Clinical Review Assistant</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
<div class="container-fluid h-100">
	<div class="row justify-content-center h-100">
		<div class="col-md-10 col-xl-8 chat">
			<div class="card">
				<div class="card-header msg_head">
					<div class="d-flex bd-highlight align-items-center">
						<div class="img_cont">
							<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img">
							<span class="online_icon"></span>
						</div>
						<div class="user_info">
							<span>Clinical Review Assistant</span>
							<p>Medical reference + payer policy RAG &middot; OCR &amp; document triage</p>
						</div>
					</div>
					<div id="caseBanner" class="case_banner" style="display:none">
						<i class="fas fa-folder-open"></i>
						Active case: <b id="caseName"></b> <span id="caseType" class="badge badge-light ml-1"></span>
						<a href="#" id="clearCase" class="ml-2">Clear case</a>
					</div>
				</div>

				<div id="messageFormeight" class="card-body msg_card_body">
					<div class="d-flex justify-content-start mb-4">
						<div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg"></div>
						<div class="msg_cotainer">
							Hi! Ask a medical question, or click <i class="fas fa-paperclip"></i> to upload a case document
							(scanned fax, PDF, image or text) and I'll extract, classify and review it against payer policy.
						</div>
					</div>
				</div>

				<div class="card-footer">
					<form id="messageArea" class="input-group">
						<div class="input-group-prepend">
							<span class="input-group-text attach_btn" id="attach" title="Upload case document"><i class="fas fa-paperclip"></i></span>
						</div>
						<input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.txt" style="display:none">
						<input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
						<div class="input-group-append">
							<button type="submit" id="send" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>

<script>
const DOC_CLASSES = {{ doc_classes | tojson }};
const BOT_IMG = "https://cdn-icons-png.flaticon.com/512/387/387569.png";
const USER_IMG = "https://i.ibb.co/d5b84Xw/Untitled-design.png";

function esc(s) { return $("<div>").text(s == null ? "" : String(s)).html(); }
function md(s) {
	return esc(s)
		.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
		.replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>")
		.replace(/\n/g, "<br>");
}
function timeStr() { const d = new Date(); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
function scrollDown() { const b = $("#messageFormeight"); b.scrollTop(b[0].scrollHeight); }
function pretty(t) { return t ? t.replace(/_/g, " ") : "unknown"; }

function addUser(html) {
	$("#messageFormeight").append(
		'<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' + html +
		'<span class="msg_time_send">' + timeStr() + '</span></div><div class="img_cont_msg"><img src="' + USER_IMG + '" class="rounded-circle user_img_msg"></div></div>');
	scrollDown();
}
function addBot(html, extraClass) {
	const el = $('<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="' + BOT_IMG +
		'" class="rounded-circle user_img_msg"></div><div class="msg_cotainer ' + (extraClass || "") + '">' + html +
		'<span class="msg_time">' + timeStr() + '</span></div></div>');
	$("#messageFormeight").append(el);
	scrollDown();
	return el;
}
function thinking(text) { return addBot('<i class="fas fa-circle-notch fa-spin"></i> ' + esc(text)); }

function sourcesHtml(sources) {
	if (!sources || !sources.length) return "";
	return '<div class="sources">Sources: ' + sources.map(s => '<span class="source_chip">' + esc(s) + '</span>').join(" ") + "</div>";
}

// ---------- Chat ----------
$("#messageArea").on("submit", function (e) {
	e.preventDefault();
	const raw = $("#text").val().trim();
	if (!raw) return;
	addUser(esc(raw));
	$("#text").val("");
	const t = thinking("Retrieving context and generating answer...");
	$.post("/get", { msg: raw })
		.done(function (data) {
			t.remove();
			addBot(md(data.answer) + sourcesHtml(data.sources));
		})
		.fail(function (xhr) {
			t.remove();
			addBot("Error: " + esc((xhr.responseJSON && xhr.responseJSON.error) || "request failed"), "msg_error");
		});
});

// ---------- Upload ----------
$("#attach").on("click", () => $("#fileInput").click());
$("#fileInput").on("change", function () {
	const file = this.files[0];
	if (!file) return;
	addUser('<i class="fas fa-file-upload"></i> ' + esc(file.name));
	const fd = new FormData();
	fd.append("file", file);
	const t = thinking("Extracting text (native / OCR) and classifying document...");
	$.ajax({ url: "/upload", type: "POST", data: fd, processData: false, contentType: false })
		.done(function (r) { t.remove(); renderDocCard(r); })
		.fail(function (xhr) {
			t.remove();
			addBot("Upload failed: " + esc((xhr.responseJSON && xhr.responseJSON.error) || "error"), "msg_error");
		});
	this.value = "";
});

function renderDocCard(r) {
	const pct = Math.round((r.confidence || 0) * 100);
	const method = { ocr: "OCR (Tesseract)", native: "Native text", mixed: "Native + OCR" }[r.extraction_method] || r.extraction_method;
	const options = DOC_CLASSES.map(c => '<option value="' + c + '"' + (c === r.doc_type ? " selected" : "") + ">" + pretty(c) + "</option>").join("");
	const review = r.needs_review
		? '<div class="review_box"><span class="badge badge-warning"><i class="fas fa-exclamation-triangle"></i> Needs review</span> ' +
		  'Low classifier confidence. Confirm type: <select class="type_select">' + options + '</select> ' +
		  '<button class="btn btn-sm btn-light confirm_btn">Confirm</button></div>'
		: '<div class="review_box"><span class="badge badge-success"><i class="fas fa-check"></i> Auto-classified</span></div>';
	const html =
		'<div class="doc_card">' +
		'<div class="doc_title"><i class="fas fa-file-medical"></i> Document processed</div>' +
		'<table class="doc_table">' +
		"<tr><td>File</td><td>" + esc(r.filename) + "</td></tr>" +
		'<tr><td>Text extraction</td><td><span class="badge badge-dark">' + esc(method) + "</span> " + r.pages + " page(s), " + r.char_count + " chars</td></tr>" +
		'<tr><td>Document type</td><td><span class="badge badge-info doc_type_label">' + esc(pretty(r.doc_type)) + "</span></td></tr>" +
		'<tr><td>Confidence</td><td><div class="conf"><div class="conf_bar ' + (r.needs_review ? "low" : "") + '" style="width:' + pct + '%"></div></div> ' + pct + "%</td></tr>" +
		"</table>" + review +
		(r.warning ? '<div class="text-warning small mt-1">' + esc(r.warning) + "</div>" : "") +
		'<details><summary>Extracted text preview</summary><pre>' + esc(r.preview) + "</pre></details>" +
		'<div class="doc_hint">Try: <a href="#" class="suggest">Summarize this case</a> &middot; ' +
		'<a href="#" class="suggest">Does this patient meet the policy criteria?</a></div>' +
		"</div>";
	addBot(html);
	$("#caseName").text(r.filename);
	$("#caseType").text(pretty(r.doc_type));
	$("#caseBanner").show();
}

$(document).on("click", ".confirm_btn", function () {
	const box = $(this).closest(".review_box");
	const card = $(this).closest(".doc_card");
	const docType = box.find(".type_select").val();
	$.post("/confirm_type", { doc_type: docType }).done(function () {
		box.html('<span class="badge badge-success"><i class="fas fa-user-check"></i> Confirmed by reviewer</span> as ' + esc(pretty(docType)));
		card.find(".doc_type_label").text(pretty(docType));
		$("#caseType").text(pretty(docType));
	});
});

$(document).on("click", ".suggest", function (e) {
	e.preventDefault();
	$("#text").val($(this).text());
	$("#messageArea").submit();
});

$("#clearCase").on("click", function (e) {
	e.preventDefault();
	$.post("/reset").done(function () {
		$("#caseBanner").hide();
		addBot("Case cleared. Back to general medical Q&amp;A.");
	});
});

// Start each page load with no active case.
$.post("/reset");
</script>
</body>
</html>
